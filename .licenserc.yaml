# Configuration for Apache SkyWalking Eyes license header checker (https://github.com/apache/skywalking-eyes)

header:
  license:
    spdx-id: Apache-2.0
    copyright-owner: The OVN-Kubernetes-MCP Contributors
    content: |
      SPDX-FileCopyrightText: Copyright The OVN-Kubernetes-MCP Contributors
      SPDX-License-Identifier: Apache-2.0

  paths:
    - '**/*.go'
    - '**/*.sh'
    - '**/*.py'
    - '**/Makefile'
    - '**/Dockerfile'
    - '**/Dockerfile.*'

  paths-ignore:
    # Third-party vendored code (has its own licenses)
    - 'vendor/**'

  comment: on-failure
